<!DOCTYPE html>
<html lag="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>
            Today
        </title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="dashboard">
            <header class="topbar">
                <div class="logo">today.</div>

                <button class=theme-button aria-label="Toggle theme">
                    ☼
                </button>
            </header>

            <section class="intro">
                <p class="eyebrow">Good morning</p>
                <h1>Make today count.</h1>
                <p class="date">Tuessay, September 13</p>
            </section>

            <section class="weather-card">
                <div>
                    <p class="card-label">Weather</p>
                    <p class="weather-location">Lahore</p>
                </div>

                <div class="weather-temperature">
                    <span>27</span>°
                </div>

                <p class="weather-description">Partly cloudy</p>
                </section>

            </section>
        </main>
    </body>
</html>
